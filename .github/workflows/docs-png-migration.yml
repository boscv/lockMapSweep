name: One-time README PNG asset migration
on:
  push:
    branches: [docs/png-readme-assets]
    paths:
      - .github/workflows/docs-png-migration.yml
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Render diagrams and update both READMEs
        run: |
          python -m pip install --disable-pip-version-check cairosvg==2.8.2
          python - <<'PY'
          from pathlib import Path
          import re
          import cairosvg

          folder = Path("docs/images")
          assets = [
              "01-simple-block-coverage",
              "02-fragmented-connected-regions",
              "03-avoid-costly-detours",
              "04-proportional-regions",
              "05-failure-cooldown-retry",
              "06-transit-through-completed-block",
          ]
          for base in assets:
              for lang in ("", ".pt-BR"):
                  svg = folder / (base + lang + ".svg")
                  png = folder / (base + lang + ".png")
                  if not svg.is_file():
                      raise RuntimeError(f"Missing source SVG: {svg}")
                  cairosvg.svg2png(url=str(svg), write_to=str(png), scale=2)
                  with png.open("rb") as f:
                      if f.read(8) != bytes.fromhex("89504e470d0a1a0a"):
                          raise RuntimeError(f"Invalid PNG: {png}")
                  svg.unlink()

          for name, lang in (("README.md", ""), ("README.pt-BR.md", ".pt-BR")):
              p = Path(name)
              s = p.read_text(encoding="utf-8")
              for base in assets:
                  old = f"docs/images/{base}{lang}.svg"
                  new = f"docs/images/{base}{lang}.png"
                  if s.count(old) != 1:
                      raise RuntimeError(f"Expected exactly one link to {old}")
                  s = s.replace(old, new)
              if ".svg" in " ".join(line for line in s.splitlines() if "docs/images/" in line):
                  raise RuntimeError(f"Remaining SVG link in {name}")
              p.write_text(s, encoding="utf-8")
          Path(".github/workflows/docs-png-migration.yml").unlink()
          print("Converted 12 diagrams; updated both READMEs; removed old SVGs.")
          PY
      - name: Commit documentation assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A README.md README.pt-BR.md docs/images .github/workflows/docs-png-migration.yml
          git diff --cached --check
          git commit -m "docs: replace README SVG diagrams with PNG images"
          git push origin HEAD:docs/png-readme-assets
