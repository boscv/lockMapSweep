<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="400px" version="1.1" viewBox="0 0 900 400" width="900px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><title>Falha de rota com retry após espera</title><desc>Três etapas: rota falha sem visita, espera de 30 segundos e chegada confirmada que pode receber uma visita.</desc><defs><marker id="blue-arrow" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="8" orient="auto" refX="8" refY="4"><path d="M0,0 L8,4 L0,8 Z" fill="#2563eb" /></marker><marker id="green-arrow" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="8" orient="auto" refX="8" refY="4"><path d="M0,0 L8,4 L0,8 Z" fill="#16a34a" /></marker><marker id="orange-arrow" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="8" orient="auto" refX="8" refY="4"><path d="M0,0 L8,4 L0,8 Z" fill="#d97706" /></marker><marker id="purple-arrow" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="8" orient="auto" refX="8" refY="4"><path d="M0,0 L8,4 L0,8 Z" fill="#7c3aed" /></marker></defs><rect fill="#ffffff" height="400" rx="18" stroke="#dce4ee" stroke-width="1" width="900" x="0" y="0" /><text fill="#15283f" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" x="30" y="39">05  |  Rota falha não é visita</text><text fill="#52647b" font-family="Arial, Helvetica, sans-serif" font-size="13" x="30" y="62">Um destino com falha continua pendente e pode ser tentado após 30 segundos</text><rect fill="#f7f9fc" height="213" rx="12" stroke="#d8e1eb" stroke-width="2" width="250" x="35" y="105" /><text fill="#dc2626" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="160" y="139">ROTA FALHA</text><text fill="#dc2626" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="160" y="286">0 visitas</text><rect fill="#f7f9fc" height="213" rx="12" stroke="#d8e1eb" stroke-width="2" width="250" x="332" y="105" /><text fill="#d97706" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="457" y="139">ESPERA</text><text fill="#d97706" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="457" y="286">0 visitas</text><rect fill="#f7f9fc" height="213" rx="12" stroke="#d8e1eb" stroke-width="2" width="250" x="628" y="105" /><text fill="#16a34a" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="753" y="139">RETRY CONFIRMADO</text><text fill="#16a34a" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="753" y="286">+1 confirmada</text><circle cx="90" cy="218" fill="#2563eb" r="12" /><line stroke="#dc2626" stroke-dasharray="8 5" stroke-linecap="round" stroke-width="3" x1="105" x2="224" y1="218" y2="218" /><text fill="#dc2626" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="bold" text-anchor="middle" x="225" y="224">×</text><text fill="#d97706" font-family="Arial, Helvetica, sans-serif" font-size="41" font-weight="bold" text-anchor="middle" x="457" y="222">30 s</text><circle cx="674" cy="218" fill="#2563eb" r="12" /><line stroke="#16a34a" stroke-dasharray="8 5" stroke-linecap="round" stroke-width="3" x1="689" x2="805" y1="218" y2="218" /><circle cx="816" cy="218" fill="#16a34a" r="16" /><text fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="816" y="224">✓</text><line marker-end="url(#orange-arrow)" stroke="#d97706" stroke-dasharray="0" stroke-linecap="round" stroke-width="3" x1="288" x2="327" y1="212" y2="212" /><line marker-end="url(#green-arrow)" stroke="#16a34a" stroke-dasharray="0" stroke-linecap="round" stroke-width="3" x1="585" x2="624" y1="212" y2="212" /><text fill="#52647b" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" x="45" y="359">Se todos os destinos falharem, as quotas continuam pendentes; o fallback é suspenso.</text></svg>