<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="400px" version="1.1" viewBox="0 0 900 400" width="900px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><title>Nonconsecutive per-block quotas</title><desc>A block retains its incomplete visit count while the character explores other blocks. Illustrative sequence: A, B, D, A, C, B, C, D.</desc><defs><marker id="blue-arrow" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="8" orient="auto" refX="8" refY="4"><path d="M0,0 L8,4 L0,8 Z" fill="#2563eb" /></marker><marker id="green-arrow" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="8" orient="auto" refX="8" refY="4"><path d="M0,0 L8,4 L0,8 Z" fill="#16a34a" /></marker><marker id="orange-arrow" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="8" orient="auto" refX="8" refY="4"><path d="M0,0 L8,4 L0,8 Z" fill="#d97706" /></marker><marker id="purple-arrow" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="8" orient="auto" refX="8" refY="4"><path d="M0,0 L8,4 L0,8 Z" fill="#7c3aed" /></marker></defs><rect fill="#ffffff" height="400" rx="18" stroke="#dce4ee" stroke-width="1" width="900" x="0" y="0" /><text fill="#15283f" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" x="30" y="39">03  |  Leaving a block does not finish its quota</text><text fill="#52647b" font-family="Arial, Helvetica, sans-serif" font-size="13" x="30" y="62">Illustrative planning sequence • quota = 2 • block A is visited nonconsecutively</text><rect fill="#e9f2ff" height="130" rx="0" stroke="#a9b7c6" stroke-width="2" width="240" x="58" y="90" /><text fill="#15283f" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" x="75" y="112">Block A</text><rect fill="#f0f9ef" height="130" rx="0" stroke="#a9b7c6" stroke-width="2" width="240" x="298" y="90" /><text fill="#15283f" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" x="315" y="112">Block B</text><rect fill="#fff4e5" height="130" rx="0" stroke="#a9b7c6" stroke-width="2" width="240" x="58" y="220" /><text fill="#15283f" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" x="75" y="242">Block C</text><rect fill="#f6eeff" height="130" rx="0" stroke="#a9b7c6" stroke-width="2" width="240" x="298" y="220" /><text fill="#15283f" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" x="315" y="242">Block D</text><line marker-end="url(#purple-arrow)" stroke="#7c3aed" stroke-dasharray="8 5" stroke-linecap="round" stroke-width="3" x1="135" x2="372" y1="143" y2="137" /><line marker-end="url(#purple-arrow)" stroke="#7c3aed" stroke-dasharray="8 5" stroke-linecap="round" stroke-width="3" x1="372" x2="384" y1="137" y2="286" /><line marker-end="url(#purple-arrow)" stroke="#7c3aed" stroke-dasharray="8 5" stroke-linecap="round" stroke-width="3" x1="384" x2="185" y1="286" y2="184" /><line marker-end="url(#purple-arrow)" stroke="#7c3aed" stroke-dasharray="8 5" stroke-linecap="round" stroke-width="3" x1="185" x2="156" y1="184" y2="302" /><line marker-end="url(#purple-arrow)" stroke="#7c3aed" stroke-dasharray="8 5" stroke-linecap="round" stroke-width="3" x1="156" x2="428" y1="302" y2="183" /><line marker-end="url(#purple-arrow)" stroke="#7c3aed" stroke-dasharray="8 5" stroke-linecap="round" stroke-width="3" x1="428" x2="216" y1="183" y2="325" /><line marker-end="url(#purple-arrow)" stroke="#7c3aed" stroke-dasharray="8 5" stroke-linecap="round" stroke-width="3" x1="216" x2="425" y1="325" y2="332" /><circle cx="135" cy="143" fill="#7c3aed" r="15" stroke="#fff" stroke-width="3" /><text fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" x="135" y="148">1</text><circle cx="372" cy="137" fill="#7c3aed" r="15" stroke="#fff" stroke-width="3" /><text fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" x="372" y="142">2</text><circle cx="384" cy="286" fill="#7c3aed" r="15" stroke="#fff" stroke-width="3" /><text fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" x="384" y="291">3</text><circle cx="185" cy="184" fill="#7c3aed" r="15" stroke="#fff" stroke-width="3" /><text fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" x="185" y="189">4</text><circle cx="156" cy="302" fill="#7c3aed" r="15" stroke="#fff" stroke-width="3" /><text fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" x="156" y="307">5</text><circle cx="428" cy="183" fill="#7c3aed" r="15" stroke="#fff" stroke-width="3" /><text fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" x="428" y="188">6</text><circle cx="216" cy="325" fill="#7c3aed" r="15" stroke="#fff" stroke-width="3" /><text fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" x="216" y="330">7</text><circle cx="425" cy="332" fill="#7c3aed" r="15" stroke="#fff" stroke-width="3" /><text fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" x="425" y="337">8</text><text fill="#15283f" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" text-anchor="start" x="560" y="114">Example sequence</text><text fill="#52647b" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="start" x="560" y="150">1: A gets its first visit</text><text fill="#52647b" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="start" x="560" y="174">2: B gets its first visit</text><text fill="#52647b" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="start" x="560" y="198">3: D gets its first visit</text><text fill="#52647b" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="start" x="560" y="222">4: A receives its second</text><text fill="#52647b" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="start" x="560" y="246">5–8: other quotas finish</text><text fill="#52647b" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="start" x="560" y="270" /><text fill="#52647b" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="start" x="560" y="294">A stays at 1/2 between</text><text fill="#52647b" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="start" x="560" y="318">steps 1 and 4.</text></svg>