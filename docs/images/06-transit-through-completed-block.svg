<svg baseProfile="full" height="440px" version="1.1" viewBox="0 0 920 440" width="920px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="blue-arrow" markerHeight="10" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="10" refY="5"><path d="M0 0 L10 5 L0 10 Z" fill="#2463EB" /></marker><marker id="green-arrow" markerHeight="10" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="10" refY="5"><path d="M0 0 L10 5 L0 10 Z" fill="#0C9865" /></marker><marker id="orange-arrow" markerHeight="10" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="10" refY="5"><path d="M0 0 L10 5 L0 10 Z" fill="#C77117" /></marker><marker id="purple-arrow" markerHeight="10" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="10" refY="5"><path d="M0 0 L10 5 L0 10 Z" fill="#8A4FD8" /></marker></defs><rect fill="#FFFFFF" height="440" rx="16" stroke="#DCE6EF" stroke-width="2" width="920" x="0" y="0" /><text fill="#17324B" font-family="Arial, Helvetica, sans-serif" font-size="22px" font-weight="bold" x="28" y="40">06  |  Cross a block that is already complete</text><text fill="#57718A" font-family="Arial, Helvetica, sans-serif" font-size="13px" x="28" y="65">The useful route passes through B without awarding another coverage visit</text><rect fill="#E8F2FF" height="240" rx="0" stroke="#B6C8DB" stroke-width="1.6" width="164" x="55" y="99" /><rect fill="#EEF4F7" height="240" rx="0" stroke="#B6C8DB" stroke-width="1.6" width="164" x="219" y="99" /><rect fill="#EAF7EF" height="240" rx="0" stroke="#B6C8DB" stroke-width="1.6" width="164" x="383" y="99" /><text fill="#2463EB" font-family="Arial, Helvetica, sans-serif" font-size="16px" font-weight="bold" text-anchor="middle" x="135" y="127">A · 1/2</text><text fill="#57718A" font-family="Arial, Helvetica, sans-serif" font-size="16px" font-weight="bold" text-anchor="middle" x="301" y="127">B · 2/2</text><text fill="#0C9865" font-family="Arial, Helvetica, sans-serif" font-size="16px" font-weight="bold" text-anchor="middle" x="467" y="127">C · 0/2</text><rect fill="#67727F" height="53" rx="0" stroke="#67727F" stroke-width="1.6" width="162" x="220" y="147" /><rect fill="#67727F" height="79" rx="0" stroke="#67727F" stroke-width="1.6" width="162" x="220" y="257" /><text fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="14px" font-weight="bold" text-anchor="middle" x="301" y="178">WALL</text><text fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="14px" font-weight="bold" text-anchor="middle" x="301" y="300">WALL</text><polyline fill="none" marker-end="url(#blue-arrow)" points="116,229 301,229 471,229" stroke="#2463EB" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" /><circle cx="116" cy="229" fill="#2463EB" r="17" stroke="#FFF" stroke-width="3" /><text fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="15px" font-weight="bold" text-anchor="middle" x="116" y="234">1</text><circle cx="301" cy="229" fill="#FFF" r="13" stroke="#C77117" stroke-width="4" /><circle cx="471" cy="229" fill="#0C9865" r="17" stroke="#FFF" stroke-width="3" /><text fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="15px" font-weight="bold" text-anchor="middle" x="471" y="234">2</text><text fill="#C77117" font-family="Arial, Helvetica, sans-serif" font-size="12px" font-weight="bold" text-anchor="middle" x="301" y="247">transit</text><text fill="#17324B" font-family="Arial, Helvetica, sans-serif" font-size="19px" font-weight="bold" text-anchor="start" x="583" y="137">Why travel through B?</text><text fill="#57718A" font-family="Arial, Helvetica, sans-serif" font-size="14px" font-weight="normal" text-anchor="start" x="583" y="180">A pending destination lies in C.</text><text fill="#57718A" font-family="Arial, Helvetica, sans-serif" font-size="14px" font-weight="normal" text-anchor="start" x="583" y="203">B has met its quota: 2/2.</text><text fill="#57718A" font-family="Arial, Helvetica, sans-serif" font-size="14px" font-weight="normal" text-anchor="start" x="583" y="226">The corridor through B is usable.</text><text fill="#57718A" font-family="Arial, Helvetica, sans-serif" font-size="14px" font-weight="normal" text-anchor="start" x="583" y="249" /><text fill="#57718A" font-family="Arial, Helvetica, sans-serif" font-size="14px" font-weight="normal" text-anchor="start" x="583" y="272">Crossing B gives no extra visits.</text><text fill="#57718A" font-family="Arial, Helvetica, sans-serif" font-size="14px" font-weight="normal" text-anchor="start" x="583" y="295">A confirmed arrival in C updates</text><text fill="#57718A" font-family="Arial, Helvetica, sans-serif" font-size="14px" font-weight="normal" text-anchor="start" x="583" y="318">only the quota for C.</text><text fill="#57718A" font-family="Arial, Helvetica, sans-serif" font-size="14px" font-weight="normal" text-anchor="start" x="583" y="341" /><text fill="#57718A" font-family="Arial, Helvetica, sans-serif" font-size="14px" font-weight="normal" text-anchor="start" x="583" y="364">No need to avoid B merely</text><text fill="#57718A" font-family="Arial, Helvetica, sans-serif" font-size="14px" font-weight="normal" text-anchor="start" x="583" y="387">because its quota is complete.</text></svg>