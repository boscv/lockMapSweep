<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="400px" version="1.1" viewBox="0 0 900 400" width="900px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><title>Ilustração de seleção proporcional</title><desc>Regiões com áreas elegíveis de 60, 30 e 10% no exemplo; o histórico altera prioridades probabilísticas, sem quota fixa por região.</desc><defs><marker id="blue-arrow" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="8" orient="auto" refX="8" refY="4"><path d="M0,0 L8,4 L0,8 Z" fill="#2563eb" /></marker><marker id="green-arrow" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="8" orient="auto" refX="8" refY="4"><path d="M0,0 L8,4 L0,8 Z" fill="#16a34a" /></marker><marker id="orange-arrow" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="8" orient="auto" refX="8" refY="4"><path d="M0,0 L8,4 L0,8 Z" fill="#d97706" /></marker><marker id="purple-arrow" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="8" orient="auto" refX="8" refY="4"><path d="M0,0 L8,4 L0,8 Z" fill="#7c3aed" /></marker></defs><rect fill="#ffffff" height="400" rx="18" stroke="#dce4ee" stroke-width="1" width="900" x="0" y="0" /><text fill="#15283f" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" x="30" y="39">04  |  Seleção proporcional ao longo do tempo</text><text fill="#52647b" font-family="Arial, Helvetica, sans-serif" font-size="13" x="30" y="62">A área elegível orienta a escolha; o histórico ajusta prioridades futuras</text><rect fill="#f6f8fb" height="224" rx="0" stroke="#a9b7c6" stroke-width="2" width="490" x="55" y="98" /><rect fill="#dceafe" height="194" rx="2" stroke="#fff" stroke-width="3" width="275" x="70" y="113" /><text fill="#15283f" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" x="207.5" y="205">Região A</text><rect fill="#e3f6e8" height="194" rx="2" stroke="#fff" stroke-width="3" width="135" x="345" y="113" /><text fill="#15283f" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" x="412.5" y="205">Região B</text><rect fill="#fdf0d9" height="194" rx="2" stroke="#fff" stroke-width="3" width="50" x="480" y="113" /><text fill="#15283f" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" x="505.0" y="205">C</text><text fill="#52647b" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" x="70" y="348">Áreas elegíveis ilustrativas: A 60%  ·  B 30%  ·  C 10%</text><text fill="#15283f" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" text-anchor="start" x="580" y="112">Sem rodízio fixo</text><text fill="#52647b" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="start" x="580" y="151">Regiões maiores tendem a ter</text><text fill="#52647b" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="start" x="580" y="175">mais chances de escolha.</text><text fill="#52647b" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="start" x="580" y="199" /><text fill="#52647b" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="start" x="580" y="223">Se a pequena C for esquecida,</text><text fill="#52647b" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="start" x="580" y="247">seu histórico eleva a prioridade.</text><text fill="#52647b" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="start" x="580" y="271" /><text fill="#52647b" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="start" x="580" y="295">Não há mínimo por região</text><text fill="#52647b" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="start" x="580" y="319">garantido a cada rodada.</text></svg>