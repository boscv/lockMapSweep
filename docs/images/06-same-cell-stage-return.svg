<svg baseProfile="full" height="400px" version="1.1" viewBox="0 0 900 400" width="900px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><title>Same-cell departure and confirmed return</title><desc>Illustrative example: eligible destination at (20,26), staging at (21,25) outside the x-restricted destination area, and a confirmed return.</desc><defs><marker id="blue-arrow" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="8" orient="auto" refX="8" refY="4"><path d="M0,0 L8,4 L0,8 Z" fill="#2563eb" /></marker><marker id="green-arrow" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="8" orient="auto" refX="8" refY="4"><path d="M0,0 L8,4 L0,8 Z" fill="#16a34a" /></marker><marker id="orange-arrow" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="8" orient="auto" refX="8" refY="4"><path d="M0,0 L8,4 L0,8 Z" fill="#d97706" /></marker><marker id="purple-arrow" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="8" orient="auto" refX="8" refY="4"><path d="M0,0 L8,4 L0,8 Z" fill="#7c3aed" /></marker></defs><rect fill="#ffffff" height="400" rx="18" stroke="#dce4ee" stroke-width="1" width="900" x="0" y="0" /><text fill="#15283f" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" x="30" y="39">06  |  Already on the only eligible destination</text><text fill="#52647b" font-family="Arial, Helvetica, sans-serif" font-size="13" x="30" y="62">Example with x = 20 destination restriction and staging movement</text><rect fill="#f3f5f8" height="66" rx="0" stroke="#c7d2df" stroke-width="1" width="66" x="65" y="93" /><text fill="#52647b" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" x="98.0" y="131.0">19,24</text><rect fill="#dbeafe" height="66" rx="0" stroke="#c7d2df" stroke-width="1" width="66" x="131" y="93" /><text fill="#52647b" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight=