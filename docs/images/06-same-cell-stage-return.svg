a, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" x="164.0" y="263.0">20,26</text><rect fill="#f3f5f8" height="66" rx="0" stroke="#c7d2df" stroke-width="1" width="66" x="197" y="225" /><text fill="#52647b" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" x="230.0" y="263.0">21,26</text><rect fill="#f3f5f8" height="66" rx="0" stroke="#c7d2df" stroke-width="1" width="66" x="263" y="225" /><text fill="#52647b" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" x="296.0" y="263.0">22,26</text><rect fill="#f3f5f8" height="66" rx="0" stroke="#c7d2df" stroke-width="1" width="66" x="65" y="291" /><text fill="#52647b" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" x="98.0" y="329.0">19,27</text><rect fill="#dbeafe" height="66" rx="0" stroke="#c7d2df" stroke-width="1" width="66" x="131" y="291" /><text fill="#52647b" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" x="164.0" y="329.0">20,27</text><rect fill="#f3f5f8" height="66" rx="0" stroke="#c7d2df" stroke-width="1" width="66" x="197" y="291" /><text fill="#52647b" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" x="230.0" y="329.0">21,27</text><rect fill="#f3f5f8" height="66" rx="0" stroke="#c7d2df" stroke-width="1" width="66" x="263" y="291" /><text fill="#52647b" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" x="296.0" y="329.0">22,27</text><text fill="#2563eb" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" x="164.0" y="80">x = 20 allowed</text><circle cx="164.0" cy="258.0" fill="none" r="24" stroke="#2563eb" stroke-width="4" /><circle cx="230.0" cy="192.0" fill="none" r="20" stroke="#d97706" stroke-width="4" /><line marker-end="url(#orange-arrow)" stroke="#d97706" stroke-dasharray="7 4" stroke-linecap="round" stroke-width="4" x1="185.0" x2="210.0" y1="239.0" y2="211.0" /><line marker-end="url(#green-arrow)" stroke="#16a34a" stroke-dasharray="6 5" stroke-linecap="round" stroke-width="4" x1="218.0" x2="177.0" y1="217.0" y2="233.0" /><text fill="#15283f" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" text-anchor="start" x="401" y="120">Step 1 — current cell</text><text fill="#52647b" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" x="401" y="146">At (20,26), no new visit is credited.</text><text fill="#d97706" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" text-anchor="start" x="401" y="202">Step 2 — staging</text><text fill="#52647b" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" x="401" y="229">Move to (21,25); this is transit,</text><text fill="#52647b" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" x="401" y="249">outside the x = 20 destination filter.</text><text fill="#52647b" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" x="401" y="269">No coverage credit.</text><text fill="#16a34a" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" text-anchor="start" x="401" y="303">Step 3 — return</text><text fill="#52647b" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" x="401" y="331">Return to (20,26); confirmed</text><text fill="#52647b" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" x="401" y="351">arrival earns one new visit.</text></svg>