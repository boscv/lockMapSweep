<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="400px" version="1.1" viewBox="0 0 900 400" width="900px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><title>Disconnected regions inside one block</title><desc>An obstacle splits an upper block into regions A and B. Both are reachable by traveling through region C in a lower block; transit does not count as a coverage visit.</desc><defs><marker id="blue-arrow" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="8" orient="auto" refX="8" refY="4"><path d="M0,0 L8,4 L0,8 Z" fill="#2563eb" /></marker><marker id="green-arrow" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="8" orient="auto" refX="8" refY="4"><path d="M0,0 L8,4 L0,8 Z" fill="#16a34a" /></marker><marker id="orange-arrow" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="8" orient="auto" refX="8" refY="4"><path d="M0,0 L8,4 L0,8 Z" fill="#d97706" /></marker><marker id="purple-arrow" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="8" orient="auto" refX="8" refY="4"><path d="M0,0 L8,4 L0,8 Z" fill="#7c3aed" /></marker></defs><rect fill="#ffffff" height="400" rx="18" stroke="#dce4ee" stroke-width="1" width="900" x="0" y="0" /><text fill="#15283f" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" x="30" y="39">02  |  One block, disconnected regions</text><text fill="#52647b" font-family="Arial, Helvetica, sans-serif" font-size="13" x="30" y="62">Two islands inside the upper block are connected only through the lower block</text><rect fill="#e9f2ff" height="145" rx="0" stroke="#a9b7c6" stroke-width="2" width="510" x="55" y="83" /><rect fill="#eef9f0" height="118" rx="0" stroke="#a9b7c6" stroke-width="2" width="510" x="55" y="228" /><text fill="#15283f" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" x="72" y="105">Upper block</text><text fill="#15283f" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" x="72" y="247">Lower connector block</text><rect fill="#566578" height="139" rx="0" stroke="#566578" stroke-width="0" width="62" x="270" y="87" /><text fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" x="302" y="165">WALL</text><text fill="#2563eb" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="153" y="159">Region A</text><text fill="#d97706" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="443" y="159">Region B</text><text fill="#16a34a" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="300" y="307">Region C: connector</text><polyline fill="none" points="145,184 145,269 405,269 442,184" stroke="#2563eb" stroke-dasharray="9 7" stroke-linejoin="round" stroke-width="5" /><circle cx="145" cy="184" fill="#2563eb" r="9" stroke="#fff" stroke-width="3" /><circle cx="145" cy="269" fill="#16a34a" r="9" stroke="#fff" stroke-width="3" /><circle cx="405" cy="269" fill="#16a34a" r="9" stroke="#fff" stroke-width="3" /><circle cx="442" cy="184" fill="#d97706" r="9" stroke="#fff" stroke-width="3" /><text fill="#15283f" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" text-anchor="start" x="600" y="111">Key idea</text><text fill="#52647b" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="start" x="600" y="147">A and B share a grid block,</text><text fill="#52647b" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="start" x="600" y="171">but not a connected region.</text><text fill="#52647b" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="start" x="600" y="195" /><text fill="#52647b" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="start" x="600" y="219">A route from A to B can</text><text fill="#52647b" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="start" x="600" y="243">cross region C first.</text><text fill="#52647b" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="start" x="600" y="267" /><text fill="#52647b" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="start" x="600" y="291">Passing through C as transit</text><text fill="#52647b" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="start" x="600" y="315">does not count as a visit.</text></svg>