<?xml version="1.0" encoding="utf-8" ?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink" baseProfile="full" height="440px" version="1.1" viewBox="0 0 920 440" width="920px">
  <defs>
    <marker id="green-arr" markerHeight="10" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="9" refY="5">
      <path d="M0,0 L10,5 L0,10 Z" fill="#07865f"/>
    </marker>
    <marker id="orange-arr" markerHeight="10" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="9" refY="5">
      <path d="M0,0 L10,5 L0,10 Z" fill="#c26d14"/>
    </marker>
    <marker id="purple-arr" markerHeight="10" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="9" refY="5">
      <path d="M0,0 L10,5 L0,10 Z" fill="#7754bc"/>
    </marker>
    <marker id="blue-arr" markerHeight="10" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="9" refY="5">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect fill="#fff" height="440" rx="16" stroke="#dce6ef" stroke-width="2" width="920" x="0" y="0"/>
  <text fill="#172e46" font-family="Arial, Helvetica, sans-serif" font-size="22px" font-weight="bold" text-anchor="start" x="28" y="39">03  |  Avoid costly detours</text>
  <text fill="#536b81" font-family="Arial, Helvetica, sans-serif" font-size="13px" font-weight="normal" text-anchor="start" x="28" y="65">A destination can be reachable without being worthwhile right now</text>
  <rect fill="#f8fbfd" height="253" rx="4" stroke="#b9cad8" stroke-width="1.8" width="515" x="48" y="103"/>
  <rect fill="#e8f2ff" height="253" rx="0" stroke="#b9cad8" stroke-width="1.8" width="250" x="48" y="103"/>
  <rect fill="#f7f0fc" height="253" rx="0" stroke="#b9cad8" stroke-width="1.8" width="265" x="298" y="103"/>
  <rect fill="#657485" height="174" width="37" x="291" y="110"/>
  <text fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="10px" font-weight="bold" text-anchor="middle" x="309" y="199">OBSTACLE</text>
  <text fill="#172e46" font-family="Arial, Helvetica, sans-serif" font-size="16px" font-weight="bold" text-anchor="start" x="67" y="128">Block A</text>
  <text fill="#172e46" font-family="Arial, Helvetica, sans-serif" font-size="16px" font-weight="bold" text-anchor="start" x="368" y="128">Block B</text>
  <polyline fill="none" marker-end="url(#green-arr)" points="89,230 224,230" stroke="#07865f" stroke-linecap="round" stroke-linejoin="round" stroke-width="5"/>
  <circle cx="89" cy="230" fill="#2563eb" r="14" stroke="#fff" stroke-width="3"/>
  <text fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="89" y="235">S</text>
  <circle cx="224" cy="230" fill="#07865f" r="14" stroke="#fff" stroke-width="3"/>
  <text fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="224" y="235">A</text>
  <polyline fill="none" marker-end="url(#orange-arr)" points="230,239 248,314 393,314 393,175 496,175" stroke="#c26d14" stroke-dasharray="10 7" stroke-linecap="round" stroke-linejoin="round" stroke-width="4"/>
  <circle cx="496" cy="175" fill="#c26d14" r="14" stroke="#fff" stroke-width="3"/>
  <text fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="496" y="180">B</text>
  <text fill="#c26d14" font-family="Arial, Helvetica, sans-serif" font-size="13px" font-weight="bold" text-anchor="start" x="361" y="331">long detour</text>
  <text fill="#07865f" font-family="Arial, Helvetica, sans-serif" font-size="13px" font-weight="bold" text-anchor="start" x="124" y="216">short route</text>
  <text fill="#172e46" font-family="Arial, Helvetica, sans-serif" font-size="18px" font-weight="bold" text-anchor="start" x="604" y="128">Illustrative choice</text>
  <text fill="#07865f" font-family="Arial, Helvetica, sans-serif" font-size="15px" font-weight="bold" text-anchor="start" x="604" y="164">A: nearby and useful now</text>
  <text fill="#c26d14" font-family="Arial, Helvetica, sans-serif" font-size="15px" font-weight="bold" text-anchor="start" x="604" y="203">B: reachable, but requires</text>
  <text fill="#c26d14" font-family="Arial, Helvetica, sans-serif" font-size="15px" font-weight="normal" text-anchor="start" x="604" y="227">a significant detour</text>
  <text fill="#536b81" font-family="Arial, Helvetica, sans-serif" font-size="15px" font-weight="normal" text-anchor="start" x="604" y="278">The planner may visit A</text>
  <text fill="#536b81" font-family="Arial, Helvetica, sans-serif" font-size="15px" font-weight="normal" text-anchor="start" x="604" y="303">and keep B pending.</text>
  <text fill="#536b81" font-family="Arial, Helvetica, sans-serif" font-size="14px" font-weight="normal" text-anchor="start" x="604" y="352">A later visit is not guaranteed.</text>
  <text fill="#536b81" font-family="Arial, Helvetica, sans-serif" font-size="13px" font-weight="normal" text-anchor="start" x="48" y="403">Orange line = possible route not chosen right now</text>
</svg>
