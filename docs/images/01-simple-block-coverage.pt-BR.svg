<svg baseProfile="full" height="440px" version="1.1" viewBox="0 0 920 440" width="920px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="blue-arrow" markerHeight="10" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="10" refY="5"><path d="M0 0 L10 5 L0 10 Z" fill="#2463EB" /></marker><marker id="green-arrow" markerHeight="10" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="10" refY="5"><path d="M0 0 L10 5 L0 10 Z" fill="#0C9865" /></marker><marker id="orange-arrow" markerHeight="10" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="10" refY="5"><path d="M0 0 L10 5 L0 10 Z" fill="#C77117" /></marker><marker id="purple-arrow" markerHeight="10" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="10" refY="5"><path d="M0 0 L10 5 L0 10 Z" fill="#8A4FD8" /></marker></defs><rect fill="#FFFFFF" height="440" rx="16" stroke="#DCE6EF" stroke-width="2" width="920" x="0" y="0" /><text fill="#17324B" font-family="Arial, Helvetica, sans-serif" font-size="22px" font-weight="bold" x="28" y="40">01  |  Mapa aberto: percurso sem zigue-zague</text><text fill="#57718A" font-family="Arial, Helvetica, sans-serif" font-size="13px" x="28" y="65">Exemplo ilustrativo: 2×2 blocos e 2 chegadas confirmadas por bloco</text><rect fill="#E9F2FF" height="126" rx="0" stroke="#B6C8DB" stroke-width="1.6" width="220" x="57" y="104" /><text fill="#17324B" font-family="Arial, Helvetica, sans-serif" font-size="15px" font-weight="bold" text-anchor="start" x="70" y="126">Bloco A</text><rect fill="#E9F9F0" height="126" rx="0" stroke="#B6C8DB" stroke-width="1.6" width="220" x="277" y="104" /><text fill="#17324B" font-family="Arial, Helvetica, sans-serif" font-size="15px" font-weight="bold" text-anchor="start" x="290" y="126">Bloco B</text><rect fill="#FAF0FF" height="126" rx="0" stroke="#B6C8DB" stroke-width="1.6" width="220" x="57" y="230" /><text fill="#17324B" font-family="Arial, Helvetica, sans-serif" font-size="15px" font-weight="bold" text-anchor="start" x="70" y="252">Bloco C</text><rect fill="#FFF4E9" height="126" rx="0" stroke="#B6C8DB" stroke-width="1.6" width="220" x="277" y="230" /><text fill="#17324B" font-family="Arial, Helvetica, sans-serif" font-size="15px" font-weight="bold" text-anchor="start" x="290" y="252">Bloco D</text><polyline fill="none" marker-end="url(#blue-arrow)" points="108,156 216,180" stroke="#2463EB" stroke-linecap="round" stroke-linejoin="round" stroke-width="3.5" /><polyline fill="none" marker-end="url(#blue-arrow)" points="216,180 339,155" stroke="#2463EB" stroke-linecap="round" stroke-linejoin="round" stroke-width="3.5" /><polyline fill="none" marker-end="url(#blue-arrow)" points="339,155 446,175" stroke="#2463EB" stroke-linecap="round" stroke-linejoin="round" stroke-width="3.5" /><polyline fill="none" marker-end="url(#blue-arrow)" points="446,175 448,304" stroke="#2463EB" stroke-linecap="round" stroke-linejoin="round" stroke-width="3.5" /><polyline fill="none" marker-end="url(#blue-arrow)" points="448,304 341,306" stroke="#2463EB" stroke-linecap="round" stroke-linejoin="round" stroke-width="3.5" /><polyline fill="none" marker-end="url(#blue-arrow)" points="341,306 222,319" stroke="#2463EB" stroke-linecap="round" stroke-linejoin="round" stroke-width="3.5" /><polyline fill="none" marker-end="url(#blue-arrow)" points="222,319 111,308" stroke="#2463EB" stroke-linecap="round" stroke-linejoin="round" stroke-width="3.5" /><circle cx="108" cy="156" fill="#2463EB" r="17" stroke="#FFF" stroke-width="3" /><text fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="15px" font-weight="bold" text-anchor="middle" x="108" y="161">1</text><circle cx="216" cy="180" fill="#2463EB" r="17" stroke="#FFF" stroke-width="3" /><text fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="15px" font-weight="bold" text-anchor="middle" x="216" y="185">2</text><circle cx="339" cy="155" fill="#0C9865" r="17" stroke="#FFF" stroke-width="3" /><text fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="15px" font-weight="bold" text-anchor="middle" x="339" y="160">3</text><circle cx="446" cy="175" fill="#0C9865" r="17" stroke="#FFF" stroke-width="3" /><text fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="15px" font-weight="bold" text-anchor="middle" x="446" y="180">4</text><circle cx="111" cy="308" fill="#8A4FD8" r="17" stroke="#FFF" stroke-width="3" /><text fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="15px" font-weight="bold" text-anchor="middle" x="111" y="313">5</text><circle cx="222" cy="319" fill="#8A4FD8" r="17" stroke="#FFF" stroke-width="3" /><text fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="15px" font-weight="bold" text-anchor="middle" x="222" y="324">6</text><circle cx="341" cy="306" fill="#C77117" r="17" stroke="#FFF" stroke-width="3" /><text fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="15px" font-weight="bold" text-anchor="middle" x="341" y="311">7</text><circle cx="448" cy="304" fill="#C77117" r="17" stroke="#FFF" stroke-width="3" /><text fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="15px" font-weight="bold" text-anchor="middle" x="448" y="309">8</text><text fill="#17324B" font-family="Arial, Helvetica, sans-serif" font-size="19px" font-weight="bold" text-anchor="start" x="548" y="129">Por que 4 → 8?</text><text fill="#57718A" font-family="Arial, Helvetica, sans-serif" font-size="14px" font-weight="normal" text-anchor="start" x="548" y="167">O próximo bloco está ao lado.</text><text fill="#57718A" font-family="Arial, Helvetica, sans-serif" font-size="14px" font-weight="normal" text-anchor="start" x="548" y="190">Evita cruzar toda a grade</text><text fill="#57718A" font-family="Arial, Helvetica, sans-serif" font-size="14px" font-weight="normal" text-anchor="start" x="548" y="213">até o ponto 5 sem necessidade.</text><text fill="#57718A" font-family="Arial, Helvetica, sans-serif" font-size="14px" font-weight="normal" text-anchor="start" x="548" y="236" /><text fill="#57718A" font-family="Arial, Helvetica, sans-serif" font-size="14px" font-weight="normal" text-anchor="start" x="548" y="259">Exemplo de ordem possível:</text><text fill="#57718A" font-family="Arial, Helvetica, sans-serif" font-size="14px" font-weight="normal" text-anchor="start" x="548" y="282">1 → 2 → 3 → 4 → 8 → 7 → 6 → 5</text><text fill="#57718A" font-family="Arial, Helvetica, sans-serif" font-size="14px" font-weight="normal" text-anchor="start" x="548" y="305" /><text fill="#57718A" font-family="Arial, Helvetica, sans-serif" font-size="14px" font-weight="normal" text-anchor="start" x="548" y="328">O algoritmo não garante essa</text><text fill="#57718A" font-family="Arial, Helvetica, sans-serif" font-size="14px" font-weight="normal" text-anchor="start" x="548" y="351">sequência exata em toda rodada.</text></svg>