<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="400px" version="1.1" viewBox="0 0 900 400" width="900px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><title>Quotas de cobertura por bloco</title><desc>Exemplo de grade 2 por 2 com dois destinos confirmados por bloco. Setas tracejadas indicam deslocamento ilustrativo.</desc><defs><marker id="blue-arrow" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="8" orient="auto" refX="8" refY="4"><path d="M0,0 L8,4 L0,8 Z" fill="#2563eb" /></marker><marker id="green-arrow" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="8" orient="auto" refX="8" refY="4"><path d="M0,0 L8,4 L0,8 Z" fill="#16a34a" /></marker><marker id="orange-arrow" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="8" orient="auto" refX="8" refY="4"><path d="M0,0 L8,4 L0,8 Z" fill="#d97706" /></marker><marker id="purple-arrow" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="8" orient="auto" refX="8" refY="4"><path d="M0,0 L8,4 L0,8 Z" fill="#7c3aed" /></marker></defs><rect fill="#ffffff" height="400" rx="18" stroke="#dce4ee" stroke-width="1" width="900" x="0" y="0" /><text fill="#15283f" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" x="30" y="39">01  |  Mapa simples: quotas por bloco</text><text fill="#52647b" font-family="Arial, Helvetica, sans-serif" font-size="13" x="30" y="62">Exemplo esquemático • grade 2 × 2 • 2 visitas confirmadas por bloco</text><rect fill="#e9f2ff" height="130" rx="0" stroke="#a9b7c6" stroke-width="2" width="230" x="60" y="90" /><text fill="#15283f" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="start" x="74" y="112">Bloco A</text><rect fill="#edf9ed" height="130" rx="0" stroke="#a9b7c6" stroke-width="2" width="230" x="290" y="90" /><text fill="#15283f" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="start" x="304" y="112">Bloco B</text><rect fill="#f8efff" height="130" rx="0" stroke="#a9b7c6" stroke-width="2" width="230" x="60" y="220" /><text fill="#15283f" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="start" x="74" y="242">Bloco C</text><rect fill="#fff4e5" height="130" rx="0" stroke="#a9b7c6" stroke-width="2" width="230" x="290" y="220" /><text fill="#15283f" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="start" x="304" y="242">Bloco D</text><line marker-end="url(#blue-arrow)" stroke="#2563eb" stroke-dasharray="8 5" stroke-linecap="round" stroke-width="3" x1="125" x2="210" y1="142" y2="170" /><line marker-end="url(#blue-arrow)" stroke="#2563eb" stroke-dasharray="8 5" stroke-linecap="round" stroke-width="3" x1="210" x2="352" y1="170" y2="140" /><line marker-end="url(#blue-arrow)" stroke="#2563eb" stroke-dasharray="8 5" stroke-linecap="round" stroke-width="3" x1="352" x2="440" y1="140" y2="174" /><line marker-end="url(#blue-arrow)" stroke="#2563eb" stroke-dasharray="8 5" stroke-linecap="round" stroke-width="3" x1="440" x2="130" y1="174" y2="280" /><line marker-end="url(#blue-arrow)" stroke="#2563eb" stroke-dasharray="8 5" stroke-linecap="round" stroke-width="3" x1="130" x2="213" y1="280" y2="324" /><line marker-end="url(#blue-arrow)" stroke="#2563eb" stroke-dasharray="8 5" stroke-linecap="round" stroke-width="3" x1="213" x2="359" y1="324" y2="284" /><line marker-end="url(#blue-arrow)" stroke="#2563eb" stroke-dasharray="8 5" stroke-linecap="round" stroke-width="3" x1="359" x2="448" y1="284" y2="329" /><circle cx="125" cy="142" fill="#2563eb" r="16" stroke="#fff" stroke-width="3" /><text fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" x="125" y="147">1</text><circle cx="210" cy="170" fill="#2563eb" r="16" stroke="#fff" stroke-width="3" /><text fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" x="210" y="175">2</text><circle cx="352" cy="140" fill="#16a34a" r="16" stroke="#fff" stroke-width="3" /><text fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" x="352" y="145">3</text><circle cx="440" cy="174" fill="#16a34a" r="16" stroke="#fff" stroke-width="3" /><text fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" x="440" y="179">4</text><circle cx="130" cy="280" fill="#7c3aed" r="16" stroke="#fff" stroke-width="3" /><text fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" x="130" y="285">5</text><circle cx="213" cy="324" fill="#7c3aed" r="16" stroke="#fff" stroke-width="3" /><text fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" x="213" y="329">6</text><circle cx="359" cy="284" fill="#d97706" r="16" stroke="#fff" stroke-width="3" /><text fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" x="359" y="289">7</text><circle cx="448" cy="329" fill="#d97706" r="16" stroke="#fff" stroke-width="3" /><text fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" x="448" y="334">8</text><text fill="#15283f" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" text-anchor="start" x="560" y="112">O que conta?</text><text fill="#52647b" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="start" x="560" y="148">Cada ponto numerado é um</text><text fill="#52647b" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="start" x="560" y="172">destino de cobertura com</text><text fill="#52647b" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="start" x="560" y="196">chegada confirmada.</text><text fill="#52647b" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="start" x="560" y="220" /><text fill="#52647b" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="start" x="560" y="244">A linha sugere deslocamento,</text><text fill="#52647b" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="start" x="560" y="268">não a rota real do servidor.</text><text fill="#52647b" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="start" x="560" y="292" /><text fill="#52647b" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="start" x="560" y="316">Quota por bloco = 2 nesta</text><text fill="#52647b" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="start" x="560" y="340">sequência ilustrativa.</text></svg>