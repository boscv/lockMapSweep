<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="400px" version="1.1" viewBox="0 0 900 400" width="900px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><title>Regiões separadas dentro de um bloco</title><desc>Um obstáculo separa A e B dentro do bloco superior, conectadas por C no bloco inferior. Trânsito não conta como visita.</desc><defs><marker id="blue-arrow" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="8" orient="auto" refX="8" refY="4"><path d="M0,0 L8,4 L0,8 Z" fill="#2563eb" /></marker><marker id="green-arrow" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="8" orient="auto" refX="8" refY="4"><path d="M0,0 L8,4 L0,8 Z" fill="#16a34a" /></marker><marker id="orange-arrow" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="8" orient="auto" refX="8" refY="4"><path d="M0,0 L8,4 L0,8 Z" fill="#d97706" /></marker><marker id="purple-arrow" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="8" orient="auto" refX="8" refY="4"><path d="M0,0 L8,4 L0,8 Z" fill="#7c3aed" /></marker></defs><rect fill="#ffffff" height="400" rx="18" stroke="#dce4ee" stroke-width="1" width="900" x="0" y="0" /><text fill="#15283f" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" x="30" y="39">02  |  Um bloco, regiões separadas</text><text fill="#52647b" font-family="Arial, Helvetica, sans-serif" font-size="13" x="30" y="62">Duas regiões no bloco superior conectadas apenas pelo bloco inferior</text><rect fill="#e9f2ff" height="145" rx="0" stroke="#a9b7c6" stroke-width="2" width="510" x="55" y="83" /><rect fill="#eef9f0" height="118" rx="0" stroke="#a9b7c6" stroke-width="2" width="510" x="55" y="228" /><text fill="#15283f" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" x="72" y="105">Bloco superior</text><text fill="#15283f" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" x="72" y="247">Bloco inferior de conexão</text><rect fill="#566578" height="139" rx="0" stroke="#566578" stroke-width="0" width="62" x="270" y="87" /><text fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" x="302" y="165">PAREDE</text><text fill="#2563eb" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="153" y="159">Região A</text><text fill="#d97706" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="443" y="159">Região B</text><text fill="#16a34a" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="300" y="307">Região C: conexão</text><polyline fill="none" points="145,184 145,269 405,269 442,184" stroke="#2563eb" stroke-dasharray="9 7" stroke-linejoin="round" stroke-width="5" /><circle cx="145" cy="184" fill="#2563eb" r="9" stroke="#fff" stroke-width="3" /><circle cx="145" cy="269" fill="#16a34a" r="9" stroke="#fff" stroke-width="3" /><circle cx="405" cy="269" fill="#16a34a" r="9" stroke="#fff" stroke-width="3" /><circle cx="442" cy="184" fill="#d97706" r="9" stroke="#fff" stroke-width="3" /><text fill="#15283f" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" text-anchor="start" x="600" y="111">Ideia central</text><text fill="#52647b" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="start" x="600" y="147">A e B dividem um bloco,</text><text fill="#52647b" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="start" x="600" y="171">mas não a mesma região.</text><text fill="#52647b" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="start" x="600" y="195" /><text fill="#52647b" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="start" x="600" y="219">Uma rota de A até B pode</text><text fill="#52647b" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="start" x="600" y="243">passar primeiro por C.</text><text fill="#52647b" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="start" x="600" y="267" /><text fill="#52647b" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="start" x="600" y="291">Atravessar C como trânsito</text><text fill="#52647b" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="start" x="600" y="315">não conta como visita.</text></svg>